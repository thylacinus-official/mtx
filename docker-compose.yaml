networks:
  mtx_net:
    driver: bridge

volumes:
  caddy_data:
  tuwunel_data:

services:
  caddy:
    image: caddy:${MTX_CADDY_VERSION:-2.11.4}
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "${MTX_FEDERATION_PORT:-8448}:${MTX_FEDERATION_PORT:-8448}"
    extra_hosts:
      - "livekit:host-gateway"
    networks:
      - mtx_net
    volumes:
      - ./conf/Caddyfile:/etc/caddy/Caddyfile
      - ./conf/element:/usr/share/caddy/element
      - caddy_data:/data/caddy
    environment:
      MTX_ELEMENT_DOMAIN: "${MTX_ELEMENT_DOMAIN:-${MTX_DOMAIN:?Error: MTX_ELEMENT_DOMAIN is required}}"
      MTX_ELEMENT_PORT: "${MTX_ELEMENT_PORT:-80}"
      MTX_FEDERATION_PORT: "${MTX_FEDERATION_PORT:-8448}"
      MTX_LIVEKIT_DOMAIN: "${MTX_LIVEKIT_DOMAIN:-${MTX_DOMAIN:?Error: MTX_DOMAIN or MTX_LIVEKIT_DOMAIN is required}}"
      MTX_LIVEKIT_JWT_PORT: "${MTX_LIVEKIT_JWT_PORT:-8080}"
      MTX_LIVEKIT_PORT: "${MTX_LIVEKIT_PORT:-7880}"
      MTX_TUWUNEL_DOMAIN: "${MTX_TUWUNEL_DOMAIN:-${MTX_DOMAIN:?Error: MTX_DOMAIN or MTX_TUWUNEL_DOMAIN is required}}"
      MTX_TUWUNEL_PORT: "${MTX_TUWUNEL_PORT:-8008}"
      MTX_TUWUNEL_SERVER_NAME: "${MTX_TUWUNEL_SERVER_NAME:-${MTX_DOMAIN:?Error: MTX_DOMAIN or MTX_TUWUNEL_SERVER_NAME is required}}"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:2019/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  tuwunel:
    image: jevolk/tuwunel:v${MTX_TUWUNEL_VERSION:-1.9.0}
    container_name: tuwunel
    restart: unless-stopped
    networks:
      - mtx_net
    volumes:
      - tuwunel_data:/var/lib/tuwunel
    environment:
      TUWUNEL_ADDRESS: "0.0.0.0"
      TUWUNEL_ALLOW_REGISTRATION: "true"
      TUWUNEL_DATABASE_PATH: "/var/lib/tuwunel"
      TUWUNEL_LIVEKIT_URL: "https://${MTX_LIVEKIT_DOMAIN:-${MTX_DOMAIN}}/livekit/jwt"
      TUWUNEL_PORT: "${MTX_TUWUNEL_PORT:-8008}"
      TUWUNEL_REGISTRATION_TOKEN: "${TUWUNEL_REGISTRATION_TOKEN:?Error: TUWUNEL_REGISTRATION_TOKEN is required}"
      TUWUNEL_SERVER_NAME: "${MTX_TUWUNEL_SERVER_NAME:-${MTX_DOMAIN:?Error: MTX_DOMAIN or MTX_TUWUNEL_SERVER_NAME is required}}"
      TUWUNEL_WELL_KNOWN__CLIENT: "https://${MTX_TUWUNEL_DOMAIN:-${MTX_DOMAIN}}"
      TUWUNEL_WELL_KNOWN__LIVEKIT_URL: "https://${MTX_LIVEKIT_DOMAIN:-${MTX_DOMAIN}}/livekit/jwt"
      TUWUNEL_WELL_KNOWN__SERVER: "${MTX_TUWUNEL_DOMAIN:-${MTX_DOMAIN}}:${MTX_FEDERATION_PORT:-8448}"

  element:
    image: vectorim/element-web:v${MTX_ELEMENT_VERSION:-1.12.27}
    container_name: element
    restart: unless-stopped
    profiles:
      - web
    networks:
      - mtx_net
    environment:
      ELEMENT_WEB_PORT: "${MTX_ELEMENT_PORT:-80}"
    deploy:
      resources:
        limits:
          memory: 256M

  livekit:
    image: livekit/livekit-server:v${MTX_LIVEKIT_VERSION:-1.13.6}
    container_name: livekit
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - caddy_data:/caddy
    environment:
      LIVEKIT_CONFIG: |
        port: ${MTX_LIVEKIT_PORT:-7880}
        
        keys:
          ${MTX_LIVEKIT_KEY:-devkey}: ${MTX_LIVEKIT_SECRET:?Error: MTX_LIVEKIT_SECRET is required}
        
        rtc:
          use_external_ip: false
          node_ip: ${LIVEKIT_RTC__NODE_IP:?Error: LIVEKIT_RTC__NODE_IP is required}
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 60000
          ips:
            excludes:
              - "172.17.0.0/16"
              - "172.18.0.0/16"
        
        turn:
          enabled: true
          domain: ${MTX_LIVEKIT_DOMAIN:-${MTX_DOMAIN}}
          udp_port: 3478
          tls_port: 5349
          cert_file: /caddy/certificates/acme-v02.api.letsencrypt.org-directory/${MTX_LIVEKIT_DOMAIN:-${MTX_DOMAIN}}/${MTX_LIVEKIT_DOMAIN:-${MTX_DOMAIN}}.crt
          key_file: /caddy/certificates/acme-v02.api.letsencrypt.org-directory/${MTX_LIVEKIT_DOMAIN:-${MTX_DOMAIN}}/${MTX_LIVEKIT_DOMAIN:-${MTX_DOMAIN}}.key
        
        webhook:
          api_key: ${MTX_LIVEKIT_KEY:-devkey}
          urls:
            - https://${MTX_LIVEKIT_DOMAIN:-${MTX_DOMAIN}}/livekit/jwt/sfu_webhook
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:${MTX_LIVEKIT_PORT:-7880}/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  livekit-jwt:
    image: ghcr.io/element-hq/lk-jwt-service:${MTX_LIVEKIT_JWT_SERVICE_VERSION:-0.7.0}
    container_name: livekit-jwt
    restart: unless-stopped
    networks:
      - mtx_net
    environment:
      LIVEKIT_FULL_ACCESS_HOMESERVERS: "${MTX_TUWUNEL_DOMAIN:-${MTX_DOMAIN}}"
      LIVEKIT_KEY: "${MTX_LIVEKIT_KEY:-devkey}"
      LIVEKIT_SECRET: "${MTX_LIVEKIT_SECRET:?Error: MTX_LIVEKIT_SECRET is required}"
      LIVEKIT_URL: "https://${MTX_LIVEKIT_DOMAIN:-${MTX_DOMAIN}}/livekit/sfu"
      LK_JWT_PORT: "${MTX_LIVEKIT_JWT_PORT:-8080}"